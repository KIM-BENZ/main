    function won(man) {
      var eok = Math.floor(man / 10000), rest = man % 10000;
      var r = rest ? rest.toLocaleString('ko-KR') + '만원' : '';
      if (!eok) return r;
      return eok + '억' + (r ? ' ' + r : '원');
    }
    function pad(n) { return (n < 10 ? '0' : '') + n; }

      var btns = '';
      if (m.pages) btns += '<button type="button" class="card-btn" data-i="' + i + '"><span>제원 · 옵션표 보기</span><span>→</span></button>';
      if (m.link) btns += '<a class="card-btn' + (m.pages ? ' sub' : '') + '" href="' + m.link + '" target="_blank" rel="noopener noreferrer"><span>' +
                         (m.pages ? '상세 안내 페이지' : '안내 페이지 보기') + '</span><span>↗</span></a>';
      return '<div class="card"><div class="card-top">' + chip + '</div><h3>' + m.name + '</h3>' + body + btns + '</div>';
    }

    var tabsEl = document.getElementById('tabs');
    var listEl = document.getElementById('list');
    var current = 'all';

    function renderTabs() {
      tabsEl.innerHTML = CATS.map(function (c) {
        var n = c.id === 'all' ? MODELS.length : MODELS.filter(function (m) { return m.cat === c.id; }).length;
        return '<button type="button" class="tab' + (c.id === current ? ' active' : '') + '" data-cat="' + c.id + '">' +
               c.label + '<span class="cnt">' + n + '</span></button>';
      }).join('');
    }

    function renderList() {
      var cats = current === 'all' ? CATS.slice(1) : CATS.filter(function (c) { return c.id === current; });
      var html = '';
      cats.forEach(function (c) {
        var items = [];
        MODELS.forEach(function (m, i) { if (m.cat === c.id) items.push(card(m, i)); });
        if (!items.length) return;
        html += '<h2 class="section-title">' + c.label + '</h2><div class="grid">' + items.join('') + '</div>';
      });
      listEl.innerHTML = html || '<p class="empty">해당 차종이 없습니다.</p>';
    }

    tabsEl.addEventListener('click', function (e) {
      var b = e.target.closest('.tab'); if (!b) return;
      current = b.getAttribute('data-cat');
      try { history.replaceState(null, '', current === 'all' ? location.pathname : '#' + current); } catch (err) {}
      renderTabs(); renderList();
      window.scrollTo({ top: document.querySelector('.tabs-wrap').offsetTop, behavior: 'smooth' });
    });

    // 제원표 모달
    var sheet = document.getElementById('sheet');
    var sheetBody = document.getElementById('sheetBody');
    var sheetTitle = document.getElementById('sheetTitle');
    var prevOverflow = '';

    function openSheet(m) {
      sheetTitle.textContent = m.name + ' (' + m.my + ') 제원 · 옵션표';
      sheetBody.innerHTML = m.pages.map(function (p) {
        var src = 'specs/p' + pad(p) + '.jpg';
        return '<div class="sheet-page"><a href="' + src + '" target="_blank" rel="noopener"><img src="' + src +
               '" alt="' + m.name + ' ' + m.my + ' 제원표" loading="lazy"></a></div>';
      }).join('') +
      '<div class="sheet-cta"><a class="cta-call" href="tel:01093790999">📞 견적 문의</a>' +
      '<a class="cta-kakao" href="http://pf.kakao.com/_hTPGX/chat" target="_blank" rel="noopener noreferrer">💬 카톡 상담</a></div>';
      sheetBody.scrollTop = 0;
      prevOverflow = document.body.style.overflow;
      document.body.style.overflow = 'hidden';
      sheet.classList.add('open');
    }
    function closeSheet() {
      sheet.classList.remove('open');
      document.body.style.overflow = prevOverflow;
    }

    listEl.addEventListener('click', function (e) {
      var b = e.target.closest('button.card-btn'); if (!b) return;
      openSheet(MODELS[+b.getAttribute('data-i')]);
    });
    document.getElementById('sheetClose').onclick = closeSheet;
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });

    var h = (location.hash || '').slice(1);
    if (CATS.some(function (c) { return c.id === h; })) current = h;
    renderTabs(); renderList();
  </script>

  <!-- 공통 햄버거 메뉴 (전체 사이트맵) -->
  <script src="https://kim-benz.github.io/main/nav.js"></script>
